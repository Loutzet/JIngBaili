<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>网站循环刷新工具 | 自动刷新技术支持</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none; /* 避免操作时误选文字，不影响输入框 */
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #1e2a3a 0%, #0f1724 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        /* 主面板卡片 */
        .tool-container {
            max-width: 1400px;
            width: 100%;
            background: rgba(22, 34, 48, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
            overflow: hidden;
            transition: all 0.2s ease;
        }
        /* 控制栏 */
        .control-panel {
            background: #0f212e;
            padding: 1.2rem 1.8rem;
            border-bottom: 1px solid #2d4a62;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1.2rem;
            row-gap: 1rem;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            min-width: 180px;
            flex: 2;
        }
        .input-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8bbdd0;
        }
        .input-group input {
            background: #07131c;
            border: 1px solid #2c5775;
            border-radius: 14px;
            padding: 0.7rem 1rem;
            font-size: 0.95rem;
            color: #eef4ff;
            font-family: monospace;
            transition: 0.2s;
            outline: none;
        }
        .input-group input:focus {
            border-color: #2e9cdf;
            box-shadow: 0 0 0 2px rgba(46, 156, 223, 0.3);
        }
        .input-group small {
            color: #8ea9bb;
            font-size: 0.7rem;
        }
        .button-group {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            align-items: center;
        }
        button {
            background: #1e3b4c;
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            color: #eef2fb;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            border: 1px solid #2e6d8a;
        }
        button i {
            font-style: normal;
            font-weight: bold;
            font-size: 1.1rem;
        }
        button.primary {
            background: #0f6b8c;
            border-color: #4db8e0;
            color: white;
            box-shadow: 0 4px 10px rgba(0,160,255,0.2);
        }
        button.primary:hover {
            background: #1489b3;
            transform: scale(1.02);
            cursor: pointer;
        }
        button.warning {
            background: #8b5a2b;
            border-color: #d98e2e;
        }
        button.warning:hover {
            background: #b46f2a;
        }
        button.danger {
            background: #7a2e2e;
            border-color: #c75c5c;
        }
        button.danger:hover {
            background: #9c3a3a;
        }
        button:active {
            transform: translateY(1px);
        }
        .stats {
            background: #071923b3;
            border-radius: 32px;
            padding: 0.3rem 1rem;
            font-family: monospace;
            font-size: 1rem;
            color: #b9e2ff;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-left: auto;
        }
        .stats span {
            font-weight: bold;
            color: #ffdd99;
            font-size: 1.2rem;
        }
        /* iframe 区域 */
        .iframe-wrapper {
            background: #010a12;
            height: 65vh;
            min-height: 450px;
            position: relative;
            border-top: 1px solid #2a5068;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            transition: opacity 0.2s;
        }
        .refresh-indicator {
            position: absolute;
            bottom: 18px;
            right: 22px;
            background: #000000aa;
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-family: monospace;
            color: #9ed9ff;
            pointer-events: none;
            z-index: 10;
            font-weight: bold;
            border-left: 3px solid #32cdff;
        }
        .status-badge {
            position: absolute;
            top: 15px;
            left: 20px;
            background: #00000099;
            backdrop-filter: blur(5px);
            padding: 4px 12px;
            border-radius: 28px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #eee;
            font-family: monospace;
            z-index: 10;
            pointer-events: none;
        }
        .footer-note {
            background: #07131cee;
            padding: 0.7rem;
            text-align: center;
            font-size: 0.7rem;
            color: #6e96ad;
            border-top: 1px solid #173e51;
        }
        @media (max-width: 750px) {
            .control-panel {
                flex-direction: column;
                align-items: stretch;
            }
            .stats {
                margin-left: 0;
                justify-content: center;
            }
            .button-group {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="tool-container">
    <div class="control-panel">
        <div class="input-group" style="flex: 3;">
            <label>🌐 目标网站 URL</label>
            <input type="url" id="targetUrl" placeholder="https://example.com 或 http://192.168.x.x" value="https://www.example.com">
            <small>※ 完整网址（包含协议）。因跨域限制，刷新后将重置为此地址。</small>
        </div>
        <div class="input-group" style="flex: 1;">
            <label>⏱️ 刷新间隔 (秒)</label>
            <input type="number" id="intervalSec" min="1" max="3600" step="1" value="8">
            <small>1~3600 秒，推荐 ≥3</small>
        </div>
        <div class="button-group">
            <button id="startBtn" class="primary">▶ 开始循环刷新</button>
            <button id="stopBtn" class="danger">⏹️ 停止刷新</button>
            <button id="refreshNowBtn" class="warning">🔄 手动刷新一次</button>
        </div>
        <div class="stats">
            📊 刷新次数: <span id="refreshCount">0</span>
        </div>
    </div>

    <div class="iframe-wrapper">
        <div class="status-badge" id="statusBadge">⚡ 等待开始</div>
        <div class="refresh-indicator" id="refreshIndicator">🕒 下次刷新 --</div>
        <iframe id="siteFrame" title="循环刷新的目标网页" src="about:blank" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-top-navigation-by-user-activation allow-downloads"></iframe>
    </div>
    <div class="footer-note">
        💡 提示：部分网站因安全策略 (X-Frame-Options) 可能拒绝在框架内显示 → 建议使用本工具刷新公开API文档页或允许嵌入的站点。<br>
        🔁 刷新机制：定时重置 iframe 的 src 为上方输入的 URL，实现完全重载。可随时停止/启动，计数器记录总刷新次数。
    </div>
</div>

<script>
    (function(){
        // ------ DOM 元素 ------
        const urlInput = document.getElementById('targetUrl');
        const intervalInput = document.getElementById('intervalSec');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const refreshNowBtn = document.getElementById('refreshNowBtn');
        const refreshCountSpan = document.getElementById('refreshCount');
        const siteFrame = document.getElementById('siteFrame');
        const statusBadge = document.getElementById('statusBadge');
        const refreshIndicatorSpan = document.getElementById('refreshIndicator');
        
        // ------ 状态变量 ------
        let refreshTimer = null;          // setInterval 句柄
        let refreshCounter = 0;            // 累计刷新次数
        let isRunning = false;              // 是否正在循环刷新
        let nextRefreshTimestamp = 0;       // 下一次刷新的预计时间戳 (毫秒)
        let countdownInterval = null;       // 更新倒计时的定时器
        
        // 辅助函数: 更新时间显示 & 倒计时UI
        function updateCountdownDisplay() {
            if (!isRunning) {
                refreshIndicatorSpan.innerHTML = `⏸️ 循环已停止`;
                return;
            }
            const now = Date.now();
            const remaining = Math.max(0, nextRefreshTimestamp - now);
            const secondsLeft = Math.ceil(remaining / 1000);
            if (secondsLeft <= 0 && isRunning) {
                // 理论上定时器会立即触发刷新，这里显示即将刷新
                refreshIndicatorSpan.innerHTML = `🌀 刷新中...`;
            } else {
                refreshIndicatorSpan.innerHTML = `⏳ 下次刷新: ${secondsLeft} 秒后`;
            }
        }
        
        // 停止倒计时更新定时器
        function stopCountdownUpdater() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
        }
        
        // 启动倒计时的刷新（每秒更新界面）
        function startCountdownUpdater() {
            stopCountdownUpdater();
            if (!isRunning) return;
            updateCountdownDisplay(); // 立即刷新一次
            countdownInterval = setInterval(() => {
                if (!isRunning) {
                    // 如果停止刷新，就不再更新并清理自身
                    if (countdownInterval) clearInterval(countdownInterval);
                    countdownInterval = null;
                    return;
                }
                updateCountdownDisplay();
            }, 500); // 半秒更新，显得流畅
        }
        
        // 核心刷新函数：执行iframe重载 (基于当前输入的URL)
        function executeRefresh() {
            if (!siteFrame) return;
            let targetUrl = urlInput.value.trim();
            // 校验URL格式，避免加载非法地址
            if (!targetUrl) {
                console.warn("URL为空，无法刷新");
                statusBadge.innerHTML = '⚠️ URL 不能为空';
                statusBadge.style.background = "#aa3e3edd";
                setTimeout(() => {
                    if (statusBadge && !isRunning) statusBadge.style.background = "#00000099";
                    else if (statusBadge && isRunning) statusBadge.style.background = "#0a6b3edd";
                }, 1500);
                return false;
            }
            // 补充协议判断 (如果没输入http://或https:// 则自动加上https://)
            if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                targetUrl = 'https://' + targetUrl;
                urlInput.value = targetUrl;   // 修正到输入框，用户友好
            }
            
            // 重要: 对于iframe的刷新，直接设置 src 会强制重新加载（即便相同URL也会reload）
            // 但是为了确保完全刷新，我们可以将src重置为当前同样地址；但可能部分浏览器缓存，加一个无意义hash? 
            // 不加额外参数，防止破坏站点路由。利用 iframe.src = 当前src 的方法，先清空再赋值强制刷新更好。
            const currentSrc = siteFrame.src;
            const finalUrl = targetUrl;
            
            // 避免无意义刷新: 如果iframe当前已经是目标URL，强行重新加载使用.reload？但跨域无法调用reload方法，只能用src重置。
            // 最佳策略：直接重新赋值 src（相同URL也会导致导航刷新）
            try {
                // 先置为空白，再设置真实URL保证刷新 (极短空白无感知)
                siteFrame.src = 'about:blank';
                // 强制触发重绘
                setTimeout(() => {
                    if (siteFrame) siteFrame.src = finalUrl;
                }, 30);
            } catch (e) {
                // fallback
                siteFrame.src = finalUrl;
            }
            
            // 更新计数器和状态
            refreshCounter++;
            refreshCountSpan.innerText = refreshCounter;
            
            // 更新状态角标
            statusBadge.innerHTML = `🔄 已刷新 ${refreshCounter} 次 | ${new Date().toLocaleTimeString()}`;
            statusBadge.style.background = "#0a6b3edd";
            setTimeout(() => {
                if (statusBadge && isRunning) statusBadge.style.background = "#0f572ecc";
                else if (statusBadge && !isRunning) statusBadge.style.background = "#00000099";
            }, 1000);
            
            // 刷新结束后（如果是循环模式）重置下次刷新计时戳（在间隔执行时动态更新）
            if (isRunning) {
                const intervalMs = Math.max(1000, (parseFloat(intervalInput.value) || 5) * 1000);
                nextRefreshTimestamp = Date.now() + intervalMs;
                updateCountdownDisplay();
            }
            return true;
        }
        
        // 停止循环刷新 (清除所有定时器)
        function stopRefreshing() {
            if (refreshTimer) {
                clearInterval(refreshTimer);
                refreshTimer = null;
            }
            isRunning = false;
            stopCountdownUpdater();
            // 更新界面状态
            statusBadge.innerHTML = `⏹️ 循环已停止 | 共刷新 ${refreshCounter} 次`;
            statusBadge.style.background = "#2a3b46cc";
            refreshIndicatorSpan.innerHTML = `⏸️ 刷新已停止`;
            startBtn.disabled = false;
            startBtn.classList.add("primary");
            startBtn.style.opacity = "1";
            // 启用输入框
            urlInput.disabled = false;
            intervalInput.disabled = false;
        }
        
        // 开始循环刷新 (重置现有定时器)
        function startRefreshing() {
            // 获取URL与间隔
            let targetUrl = urlInput.value.trim();
            if (!targetUrl) {
                alert("❌ 请填写需要循环刷新的网站地址！\n例如: https://www.baidu.com");
                return;
            }
            if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                targetUrl = 'https://' + targetUrl;
                urlInput.value = targetUrl;
            }
            // 验证URL合法性简单测试
            try {
                new URL(targetUrl);
            } catch(e) {
                alert("网址格式不正确，请包含 http:// 或 https:// 以及有效域名\n示例: https://example.com");
                return;
            }
            
            let intervalSec = parseFloat(intervalInput.value);
            if (isNaN(intervalSec) || intervalSec < 1) {
                intervalSec = 3;
                intervalInput.value = 3;
                alert("刷新间隔不能小于1秒，已自动设为3秒");
            }
            if (intervalSec > 3600) {
                intervalSec = 3600;
                intervalInput.value = 3600;
                alert("间隔不能超过3600秒，已调整为一小时");
            }
            const intervalMs = intervalSec * 1000;
            
            // 如果正在运行，先停止之前的定时器，再全新开始（重置计数可选? 不清零计数器更符合预期，让用户手动重置）
            if (refreshTimer) {
                clearInterval(refreshTimer);
                refreshTimer = null;
            }
            
            // 执行一次立即刷新，让页面马上加载 (用户期望点击开始后立即加载目标)
            // 为了避免双重刷新逻辑，确保先刷新一次，再设定循环
            // 但刷新过程中，setTimeout 有点异步延迟；提前设定 isRunning 避免倒计时错乱
            isRunning = true;
            // 禁用输入框防止中途修改导致逻辑混乱 (开始后不可修改，但停止后可再改，更符合交互)
            urlInput.disabled = true;
            intervalInput.disabled = true;
            
            // 先执行一次加载（保证立刻显示内容）
            // 注意: executeRefresh 里会用短暂about:blank然后载入，但会更新计数器，且需要保证isRunning标志为true
            executeRefresh();
            
            // 设定下次刷新的时间戳（基于刷新执行完毕后间隔）
            // 注意因为executeRefresh内部setTimeout异步修改src，但为了倒计时精准，我们基于当前时间+间隔
            const scheduleNextTimestamp = () => {
                if (isRunning) {
                    nextRefreshTimestamp = Date.now() + intervalMs;
                    updateCountdownDisplay();
                    startCountdownUpdater();
                }
            };
            scheduleNextTimestamp();
            
            // 设定周期性任务 (使用setInterval)
            refreshTimer = setInterval(() => {
                // 只有在 running 状态下才执行刷新
                if (isRunning) {
                    // 额外安全检测: 如果页面已经关闭或iframe异常，仍尝试刷新
                    executeRefresh();
                    // 刷新后重新设置下一次时间戳
                    if (isRunning) {
                        const curInterval = Math.max(1000, (parseFloat(intervalInput.value) || 5) * 1000);
                        nextRefreshTimestamp = Date.now() + curInterval;
                        updateCountdownDisplay();
                    }
                } else {
                    // 如果不在运行状态，清理定时器 (防御)
                    if (refreshTimer) {
                        clearInterval(refreshTimer);
                        refreshTimer = null;
                    }
                }
            }, intervalMs);
            
            // 更新界面样式
            statusBadge.innerHTML = `🟢 循环刷新中 · 间隔 ${intervalSec} 秒 · 目标已加载`;
            statusBadge.style.background = "#0f6b48dd";
            refreshIndicatorSpan.style.opacity = "1";
            startBtn.disabled = false;  // 不禁用开始按钮，但是让其看起来无法二次开始？其实可以重复开始会重置定时器
            // 但最好提示用户已经启动，停止后才能修改参数
        }
        
        // 手动刷新一次 (不影响循环状态，如果正在循环则刷新并保持后续循环)
        function manualRefresh() {
            if (isRunning) {
                // 如果在循环中，手动刷新应该重置计时周期，避免刷新冲突
                // 重置计时器循环: 清除原interval，重新设定
                if (refreshTimer) {
                    clearInterval(refreshTimer);
                    refreshTimer = null;
                }
                // 执行刷新
                executeRefresh();
                // 重新设定interval (使用最新间隔)
                let intervalSec = parseFloat(intervalInput.value);
                if (isNaN(intervalSec) || intervalSec < 1) intervalSec = 5;
                const intervalMs = intervalSec * 1000;
                refreshTimer = setInterval(() => {
                    if (isRunning) executeRefresh();
                }, intervalMs);
                // 重置下次刷新时间戳
                nextRefreshTimestamp = Date.now() + intervalMs;
                updateCountdownDisplay();
                startCountdownUpdater();
            } else {
                // 未启动循环时，手动刷新只是单独刷新页面，不影响任何状态
                executeRefresh();
                statusBadge.innerHTML = `🖱️ 手动刷新 | ${new Date().toLocaleTimeString()}`;
                setTimeout(() => {
                    if (statusBadge && !isRunning) statusBadge.innerHTML = `⏸️ 等待开始`;
                }, 1500);
            }
        }
        
        // 重置计数器（保留原有状态停止或运行时可选, 增加一个隐藏功能？为方便添加双击计数清零，但不加复杂按钮，可额外提供一个小功能：长按停止重置计数）
        // 扩展功能：停止时双击停止按钮可重置计数器
        function resetCounter() {
            refreshCounter = 0;
            refreshCountSpan.innerText = "0";
            statusBadge.innerHTML = `🧹 计数器已重置 | ${isRunning ? '刷新仍在进行' : '已停止'}`;
            setTimeout(() => {
                if (statusBadge && isRunning) statusBadge.innerHTML = `🟢 循环刷新中 · 间隔 ${intervalInput.value} 秒`;
                else if (statusBadge && !isRunning) statusBadge.innerHTML = `⏸️ 循环已停止 | 计数器已清空`;
            }, 1800);
        }
        
        // ------ 事件绑定 + 额外友好交互 ------
        startBtn.addEventListener('click', () => {
            // 如果在运行中，点击开始相当于重新启动（重置整个循环机制，保留计数器不清零但重新按最新参数开始）
            if (isRunning) {
                // 重新开始：停止当前循环后再次开始（保持URL和间隔更新）
                stopRefreshing();
                // 稍微延时让停止完成，然后开始 (保证彻底清除)
                setTimeout(() => {
                    startRefreshing();
                }, 50);
            } else {
                startRefreshing();
            }
        });
        
        stopBtn.addEventListener('click', () => {
            stopRefreshing();
            // 让状态可见，并且输入框恢复可编辑
            urlInput.disabled = false;
            intervalInput.disabled = false;
            statusBadge.innerHTML = `⏹️ 已停止刷新 | 总计刷新 ${refreshCounter} 次`;
        });
        
        refreshNowBtn.addEventListener('click', () => {
            manualRefresh();
        });
        
        // 附加: 双击停止按钮重置计数器 (便捷)
        stopBtn.addEventListener('dblclick', () => {
            if (!isRunning) {
                resetCounter();
            } else {
                // 运行时重置计数器但不清除状态，只是把数字归零
                refreshCounter = 0;
                refreshCountSpan.innerText = "0";
                statusBadge.innerHTML = `🔄 计数器归零，刷新继续`;
                setTimeout(() => {
                    if (statusBadge && isRunning) statusBadge.innerHTML = `🟢 循环刷新中 · 间隔 ${intervalInput.value} 秒`;
                }, 1200);
            }
        });
        
        // 当手动修改间隔或URL时如果当前没有运行，不需要额外处理；若运行中想要修改参数，必须停止再开始，符合逻辑
        // 保证页面关闭前清除所有定时器避免后台资源
        window.addEventListener('beforeunload', () => {
            if (refreshTimer) clearInterval(refreshTimer);
            if (countdownInterval) clearInterval(countdownInterval);
        });
        
        // 初始化加载时iframe默认显示空白，并设定默认占位example.com显示示例
        // 为了让用户看到演示，初次显示示例网站，但不自动开始刷新
        const defaultDemoUrl = "https://www.example.com";
        siteFrame.src = defaultDemoUrl;
        urlInput.value = defaultDemoUrl;
        refreshCounter = 0;
        refreshCountSpan.innerText = "0";
        statusBadge.innerHTML = "⚙️ 就绪 · 设置URL后点击开始";
